<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de prix en FCFA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="carte">
    <h1>Calculateur de prix</h1>
    <p class="intro">Calcule le total à payer en FCFA, avec la remise.</p>

    <label for="prix">Prix d'un article (FCFA)</label>
    <input type="number" id="prix" min="0" placeholder="Ex : 5000">

    <label for="quantite">Quantité</label>
    <input type="number" id="quantite" min="1" value="1">

    <label for="remise">Remise (%)</label>
    <input type="number" id="remise" min="0" max="100" value="0">

    <button id="bouton">Calculer</button>

    <p id="message" class="message"></p>

    <div id="resultat" class="resultat cache">
      <p>Sous-total : <strong id="sousTotal"></strong></p>
      <p>Remise : <strong id="montantRemise"></strong></p>
      <p class="total">Total à payer : <strong id="total"></strong></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
